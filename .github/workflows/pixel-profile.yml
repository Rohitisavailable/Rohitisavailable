name: generate-pixel-profile

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate github stats card
        uses: LuciNyan/pixel-profile/action@main
        with:
          outputs: |
            dist/github-stats?username=Rohitisavailable&include_all_commits=true&theme=road_trip
            dist/github-stats-dark?username=Rohitisavailable&include_all_commits=true&background=linear-gradient%28160deg%2C+%230b1026ff+0%25%2C+%232b4c7eff+60%25%2C+%236fd0e8ff+100%25%29&color=%23ffffffff&screen_effect=true&avatar_border=true

      - name: push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

